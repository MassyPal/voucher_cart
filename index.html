<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista della Spesa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100dvh;
      padding: 1rem;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      color: #2d3748;
    }

    /* ── Add-item row ── */
    #add-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    #new-item {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 0.5rem;
      font-size: 1rem;
      background: #fff;
    }

    #new-item:focus { outline: none; border-color: #4299e1; }

    #btn-add {
      width: 2.6rem;
      height: 2.6rem;
      border: none;
      border-radius: 0.5rem;
      background: #4299e1;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btn-add:active { background: #2b6cb0; }

    /* ── List ── */
    #item-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }

    .item-card {
      background: #fff;
      border-radius: 0.6rem;
      padding: 0.6rem 0.75rem;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .item-name {
      font-size: 0.95rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-price {
      width: 4.5rem;
      padding: 0.35rem 0.4rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 0.4rem;
      font-size: 0.9rem;
      text-align: center;
      background: #f7fafc;
    }

    .item-price:focus { outline: none; border-color: #4299e1; background: #fff; }

    .item-qty {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-qty {
      width: 1.8rem;
      height: 1.8rem;
      border: none;
      border-radius: 0.4rem;
      background: #ebf8ff;
      color: #2b6cb0;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-qty:active { background: #bee3f8; }
    .btn-qty:disabled { opacity: 0.4; cursor: not-allowed; }

    .qty-value {
      min-width: 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .btn-delete {
      width: 2rem;
      height: 2rem;
      border: none;
      border-radius: 0.4rem;
      background: #fed7d7;
      color: #c53030;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-delete:active { background: #feb2b2; }

    /* ── Totals panel ── */
    #totals {
      margin-top: 1.25rem;
      background: #fff;
      border-radius: 0.7rem;
      padding: 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
      font-size: 0.95rem;
    }

    .total-row + .total-row { border-top: 1px solid #e2e8f0; margin-top: 0.25rem; padding-top: 0.5rem; }

    .total-row.highlight { font-weight: 700; font-size: 1.05rem; }

    .total-row .label { color: #4a5568; }
    .total-row .value { font-weight: 600; }

    .voucher-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    #empty-msg {
      text-align: center;
      color: #a0aec0;
      margin-top: 2rem;
      font-size: 0.95rem;
    }

    #btn-clear {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.6rem 0.8rem;
      border: 1.5px solid #fc8181;
      border-radius: 0.5rem;
      background: #fff5f5;
      color: #c53030;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    #btn-clear:active { background: #fed7d7; }
  </style>
</head>
<body>
  <h1>🛒 Lista della Spesa</h1>

  <div id="add-row">
    <input id="new-item" type="text" placeholder="Aggiungi articolo…" autocomplete="off" />
    <button id="btn-add" aria-label="Aggiungi">+</button>
  </div>

  <ul id="item-list"></ul>
  <p id="empty-msg">Nessun articolo nella lista.</p>

  <button id="btn-clear" type="button">🗑 Svuota lista</button>

  <div id="totals">
    <div class="total-row highlight">
      <span class="label">Totale</span>
      <span class="value" id="total-amount">€ 0,00</span>
    </div>
    <div class="total-row">
      <span class="label">Buoni pasto utilizzabili</span>
      <span class="value"><span class="voucher-badge" id="voucher-count">🎟 0</span></span>
    </div>
    <div class="total-row">
      <span class="label">Valore buoni pasto</span>
      <span class="value" id="voucher-value">€ 0,00</span>
    </div>
    <div class="total-row highlight">
      <span class="label">Resto da pagare in contanti</span>
      <span class="value" id="cash-remainder">€ 0,00</span>
    </div>
  </div>

  <script>
    const VOUCHER_VALUE = 8;    // € per buono pasto
    const MAX_VOUCHERS  = 8;    // massimo per lista
    const STORAGE_KEY   = 'voucher-cart-items';

    const list        = document.getElementById('item-list');
    const emptyMsg    = document.getElementById('empty-msg');
    const newItemInput = document.getElementById('new-item');
    const btnAdd      = document.getElementById('btn-add');
    const btnClear    = document.getElementById('btn-clear');

    const elTotal     = document.getElementById('total-amount');
    const elVCount    = document.getElementById('voucher-count');
    const elVValue    = document.getElementById('voucher-value');
    const elCash      = document.getElementById('cash-remainder');

    function fmt(n) {
      return '€ ' + n.toFixed(2).replace('.', ',');
    }

    function clearIfZero(input) {
      const value = parseFloat(input.value.replace(',', '.'));
      if (isNaN(value) || value === 0) input.value = '';
    }

    function updateTotals() {
      let total = 0;
      list.querySelectorAll('.item-card').forEach(card => {
        const price = parseFloat(card.querySelector('.item-price').value.replace(',', '.')) || 0;
        const qty   = parseInt(card.querySelector('.qty-value').textContent, 10) || 0;
        total += price * qty;
      });

      const vouchersAvailable = Math.floor(total / VOUCHER_VALUE);
      const vouchers = Math.min(vouchersAvailable, MAX_VOUCHERS);
      const voucherCover = vouchers * VOUCHER_VALUE;
      const cash = Math.max(0, total - voucherCover);

      elTotal.textContent  = fmt(total);
      elVCount.textContent = '🎟 ' + vouchers;
      elVValue.textContent = fmt(voucherCover);
      elCash.textContent   = fmt(cash);

      emptyMsg.style.display = list.children.length ? 'none' : 'block';
      saveItems();
    }

    function saveItems() {
      const items = [];
      list.querySelectorAll('.item-card').forEach(card => {
        items.push({
          name:  card.querySelector('.item-name').textContent,
          price: card.querySelector('.item-price').value,
          qty:   parseInt(card.querySelector('.qty-value').textContent, 10) || 0
        });
      });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) { /* localStorage non disponibile: ignora */ }
    }

    function loadItems() {
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) { items = []; }
      items.forEach(item => {
        const li = createItem(item.name, item.price, item.qty);
        list.appendChild(li);
      });
    }

    function createItem(name, initialPrice, initialQty) {
      const li = document.createElement('li');
      li.className = 'item-card';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'item-name';
      nameSpan.textContent = name;
      nameSpan.title = name;

      const priceInput = document.createElement('input');
      priceInput.type = 'text';
      priceInput.inputMode = 'decimal';
      priceInput.pattern = '[0-9]*[.,]?[0-9]*';
      priceInput.value = initialPrice != null ? initialPrice : '0.00';
      priceInput.className = 'item-price';
      priceInput.setAttribute('aria-label', 'Prezzo');
      priceInput.addEventListener('input', updateTotals);
      priceInput.addEventListener('focus', () => clearIfZero(priceInput));

      const qtyWrap = document.createElement('div');
      qtyWrap.className = 'item-qty';

      const btnMinus = document.createElement('button');
      btnMinus.type = 'button';
      btnMinus.className = 'btn-qty';
      btnMinus.textContent = '−';
      btnMinus.setAttribute('aria-label', 'Diminuisci quantità di ' + name);

      const qtyValue = document.createElement('span');
      qtyValue.className = 'qty-value';
      qtyValue.textContent = '0';
      qtyValue.setAttribute('aria-live', 'polite');
      qtyValue.setAttribute('aria-label', 'Quantità: 0');

      const btnPlus = document.createElement('button');
      btnPlus.type = 'button';
      btnPlus.className = 'btn-qty';
      btnPlus.textContent = '+';
      btnPlus.setAttribute('aria-label', 'Aumenta quantità di ' + name);

      function setQty(n) {
        const value = Math.max(0, n);
        qtyValue.textContent = String(value);
        qtyValue.setAttribute('aria-label', 'Quantità: ' + value);
        btnMinus.disabled = value === 0;
        updateTotals();
      }

      btnMinus.addEventListener('click', () => setQty(parseInt(qtyValue.textContent, 10) - 1));
      btnPlus.addEventListener('click', () => setQty(parseInt(qtyValue.textContent, 10) + 1));

      qtyWrap.append(btnMinus, qtyValue, btnPlus);
      setQty(Math.max(0, parseInt(initialQty, 10) || 0));

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', 'Rimuovi ' + name);
      delBtn.addEventListener('click', () => { li.remove(); updateTotals(); });

      li.append(nameSpan, priceInput, qtyWrap, delBtn);
      return li;
    }

    function addItem() {
      const name = newItemInput.value.trim();
      if (!name) return;
      list.appendChild(createItem(name));
      newItemInput.value = '';
      newItemInput.focus();
      updateTotals();
    }

    function clearList() {
      if (!list.children.length) return;
      if (!confirm('Svuotare tutta la lista?')) return;
      list.innerHTML = '';
      updateTotals();
    }

    btnAdd.addEventListener('click', addItem);
    newItemInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    btnClear.addEventListener('click', clearList);

    loadItems();
    updateTotals();
  </script>
</body>
</html>
